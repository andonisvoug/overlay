<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3-Cushion Chania — Score overlay</title>
<style>
/* Transparent score overlay for PRISM / OBS. Everything outside the score bug is see-through. */
html,body{margin:0;padding:0;background:transparent!important;overflow:hidden;width:100vw;height:100vh}
*{box-sizing:border-box}
body{font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
#bug{position:fixed;width:calc(27vw * var(--k,1));font-size:calc(.75vw * var(--k,1));opacity:0;transform:translateY(1.5em);transition:opacity .4s,transform .4s}
#bug.on{opacity:1;transform:none}
.bl{left:2.2vw;bottom:2.6vw}.br{right:2.2vw;bottom:2.6vw}.tl{left:2.2vw;top:2.6vw}.tr{right:2.2vw;top:2.6vw}
.bc{left:50%;bottom:2.6vw;transform:translateX(-50%)}#bug.bc{transform:translate(-50%,1.5em)}#bug.bc.on{transform:translateX(-50%)}
.card{background:linear-gradient(180deg,rgba(13,36,54,.94),rgba(7,21,33,.94));border:.18em solid #c9a24a;border-radius:1em;overflow:hidden;box-shadow:0 .5em 1.6em rgba(0,0,0,.45)}
.top{display:flex;align-items:center;gap:.7em;padding:.55em .9em;background:linear-gradient(90deg,#c9a24a,#f3d58a 60%,#c9a24a);color:#0b2233}
.top img{width:2.4em;height:2.4em;border-radius:50%;flex:none;box-shadow:0 0 0 .12em #0b2233}
.top .t{font-weight:800;font-size:1.35em;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.top .lv{display:flex;align-items:center;gap:.35em;font-weight:800;font-size:1.15em;background:#d4202a;color:#fff;padding:.15em .55em;border-radius:.4em}
.top .lv i{width:.6em;height:.6em;border-radius:50%;background:#fff;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
.row{display:grid;grid-template-columns:1.6em 1fr auto 5.6em;align-items:center;gap:.6em;padding:.55em .9em;color:#eef3f6;border-top:.08em solid rgba(255,255,255,.08)}
.row .ar{color:#f3d58a;font-size:1.5em;visibility:hidden}
.row.act .ar{visibility:visible}
.row.act{background:rgba(243,213,138,.10)}
.row .n{font-size:1.85em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.win .n{color:#3fd08a}
.dots{display:flex;gap:.35em}.dots i{width:.95em;height:.95em;border-radius:50%;border:.16em solid #c9a24a}.dots i.on{background:#f3d58a}
.pts{text-align:right;font-weight:800;font-size:2.9em;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.pts small{font-size:.42em;color:#9fb6c6;font-weight:600;margin-left:.1em}
.ft{display:flex;flex-wrap:wrap;gap:.3em 1.2em;padding:.5em .9em .6em;font-size:1.3em;color:#9fb6c6;border-top:.08em solid rgba(255,255,255,.08)}
.ft b{color:#eef3f6}.ft .run{color:#f3d58a}

/* ---- slim one-line bar (?style=bar) ---- */
#bug.bar{width:auto;max-width:96vw;font-size:calc(.9vw * var(--k,1))}
.sl{display:flex;align-items:stretch;height:3.6em;border-radius:.7em;overflow:hidden;border:.15em solid #c9a24a;box-shadow:0 .4em 1.2em rgba(0,0,0,.45);background:rgba(7,21,33,.94);color:#eef3f6;white-space:nowrap}
.sl .lg{display:flex;align-items:center;gap:.45em;padding:0 .7em;background:linear-gradient(90deg,#c9a24a,#f3d58a);color:#0b2233;font-weight:800;font-size:1.05em}
.sl .lg img{width:2.4em;height:2.4em;border-radius:50%}
.sl .lg i{width:.55em;height:.55em;border-radius:50%;background:#d4202a;animation:bl 1.2s infinite}
.sl .pl{display:flex;align-items:center;gap:.5em;padding:0 .8em;font-size:1.45em;font-weight:700;max-width:22em}
.sl .pl .nm{overflow:hidden;text-overflow:ellipsis}
.sl .pl.act{background:rgba(243,213,138,.14)}
.sl .pl .ar{color:#f3d58a;visibility:hidden}.sl .pl.act .ar{visibility:visible}
.sl .pl.win .nm{color:#3fd08a}
.sl .sc{display:flex;align-items:center;gap:.35em;padding:0 .8em;background:#0b2233;border-left:.1em solid #c9a24a;border-right:.1em solid #c9a24a;font-weight:800;font-size:2em;font-variant-numeric:tabular-nums}
.sl .sc small{font-size:.45em;color:#9fb6c6;font-weight:600}
.sl .sc em{font-style:normal;color:#c9a24a;font-size:.7em}
.sl .dots i{width:.75em;height:.75em}
.sl .inf{display:flex;align-items:center;gap:.9em;padding:0 .9em;font-size:1.15em;color:#9fb6c6;border-left:.08em solid rgba(255,255,255,.12)}
.sl .inf b{color:#eef3f6}.sl .inf .run{color:#f3d58a}
#msg{position:fixed;left:1vw;top:1vw;font:14px sans-serif;color:#fff;background:rgba(200,0,0,.8);padding:6px 10px;border-radius:6px;display:none}
</style></head>

    if (q.id){ for (var i=0;i<list.length;i++) if (list[i].id===q.id) return list[i]; return null; }
    if (q.table){ for (var j=0;j<list.length;j++) if (String(list[j].table||'')===q.table) return list[j]; }
    return list.slice().sort(function(x,y){ return (y.upd||0)-(x.upd||0); })[0];
  }
  function got(d){
    msg.style.display='none'; fails = 0;
    var o = pick(d && d.live), key = JSON.stringify(o);
    if (key !== last){ last = key; draw(o); }
  }
  function poll(){
    if (q.demo || !/^https?:\/\//.test(url)){
      if (!q.demo){ msg.textContent = 'Overlay: paste the app link into APP_URL'; msg.style.display='block'; return; }
      var t = Math.floor(Date.now()/3000)%6;
      return got({live:[{id:'W2-1',no:7,title:'3-Cushion Chania',a:'ΠΕΤΡΟΥΛΑΚΗΣ Κ.',b:'ΜΑΡΚΟΥΛΑΚΗΣ Ν.',pa:8+t,pb:11,ta:15,tb:15,sa:0,sb:1,set:2,inn:14+t,lim:35,act:'A',run:t,prev:['11–15'],upd:1}]});
    }
    var name = '__ov'+(++cbn), s = document.createElement('script'), done = false;
    window[name] = function(d){ done = true; got(d); };
    s.src = url + (url.indexOf('?')<0?'?':'&') + 'api=live&callback=' + name + '&_=' + Date.now();
    s.onerror = function(){ fails++; if (q.debug){ msg.textContent = 'Overlay: no connection to the app ('+fails+')'; msg.style.display = 'block'; } };
    s.onload = function(){ setTimeout(function(){ try{ delete window[name]; }catch(e){ window[name]=undefined; } if (s.parentNode) s.parentNode.removeChild(s); }, 100); };
    document.head.appendChild(s);
  }
  poll(); setInterval(poll, EVERY);
})();
</script>
